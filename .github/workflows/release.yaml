name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build main.pyz
        run: |
          mkdir build

          cp main_pyz.py build/__main__.py
          cp installer.py build/ext/
          cp updater.py build/ext/
          cp wrapper.py build/ext/
          cp ventoy.cmd build/ext/
          touch build/ext/__init__.py

          python -m zipapp build \
            -o main.pyz \
            --compress

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.py
            main.pyz
